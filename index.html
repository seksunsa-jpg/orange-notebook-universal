<script>
/* PWA: ลงทะเบียน service worker แบบ inline เพื่อให้ติดตั้งเป็นแอปและเปิดออฟไลน์ได้ */
if('serviceWorker' in navigator){
  const swCode = `
    const C='osnb-universal-v2';
    self.addEventListener('install',e=>{self.skipWaiting();});
    self.addEventListener('activate',e=>{e.waitUntil(self.clients.claim());});
    self.addEventListener('fetch',e=>{
      if(e.request.method!=='GET') return;
      e.respondWith(
        caches.open(C).then(c=>c.match(e.request).then(r=>{
          const net=fetch(e.request).then(resp=>{ try{c.put(e.request,resp.clone());}catch(_){} return resp; }).catch(()=>r);
          return r||net;
        }))
      );
    });`;
  const blob=new Blob([swCode],{type:'text/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Mitr:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FDF5EA; --paper2:#FBEAD6; --ink:#3A2417; --ink2:#7A5B43;
  --orange:#E8702A; --orange-d:#C6571A; --orange-l:#F6A560; --tan:#F0D9BD;
  --line:#E4C9A8; --green:#3F8E5B; --green-l:#E2F0E5; --amber:#D99211; --amber-l:#FBEBC8;
  --red:#C8462F; --red-l:#F7E0DA; --blue:#2F6F8F;
  --shadow:0 1px 2px rgba(58,36,23,.06),0 6px 22px rgba(58,36,23,.10);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:
    radial-gradient(120% 90% at 100% 0%,#FCEAD2 0%,transparent 55%),
    radial-gradient(120% 90% at 0% 100%,#FAE0C4 0%,transparent 50%),
    var(--paper);
  color:var(--ink); -webkit-font-smoothing:antialiased; min-height:100vh;
}
h1,h2,h3,.brand,.kpi-num,.grade-badge{font-family:'Mitr',sans-serif;font-weight:600}
.app{display:flex;min-height:100vh}

/* Sidebar = orange notebook spine */
.side{
  width:248px;flex:0 0 248px;position:sticky;top:0;height:100vh;
  background:linear-gradient(180deg,var(--orange) 0%,var(--orange-d) 100%);
  color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:6px;
  box-shadow:6px 0 22px rgba(198,87,26,.22);z-index:30;
}
.side::before{content:"";position:absolute;top:0;right:0;width:8px;height:100%;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.16) 0 14px,rgba(255,255,255,0) 14px 30px)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 16px;font-size:20px;color:#fff;letter-spacing:.3px}
.brand .dot{width:34px;height:34px;border-radius:9px;background:#fff;display:grid;place-items:center;
  color:var(--orange-d);font-size:19px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.brand small{display:block;font-family:'Sarabun';font-weight:400;font-size:11px;opacity:.85;margin-top:1px}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.nav button{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;cursor:pointer;
  background:transparent;color:#fff;font-family:'Sarabun';font-size:15px;font-weight:500;
  padding:11px 13px;border-radius:10px;transition:.15s;opacity:.92;
}
.nav button .ic{width:20px;text-align:center;font-size:16px;opacity:.95}
.nav button:hover{background:rgba(255,255,255,.14);opacity:1}
.nav button.active{background:#fff;color:var(--orange-d);font-weight:600;opacity:1;box-shadow:0 3px 10px rgba(0,0,0,.14)}
.side-foot{margin-top:auto;font-size:11.5px;opacity:.82;padding:12px 10px 2px;line-height:1.5}

/* Main */
.main{flex:1;min-width:0;padding:26px 30px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{font-size:24px;margin:0;display:flex;align-items:center;gap:10px}
.topbar h1 .pg-ic{color:var(--orange)}
.crumb{font-size:13px;color:var(--ink2)}
.sel{font-family:'Sarabun';font-size:14px;font-weight:500;color:var(--ink);background:#fff;
  border:1.5px solid var(--line);border-radius:10px;padding:9px 13px;box-shadow:var(--shadow);cursor:pointer;min-width:200px}
.sel:focus{outline:none;border-color:var(--orange)}
label.fld{font-size:12.5px;color:var(--ink2);font-weight:600;display:block;margin-bottom:5px}

/* Cards */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:22px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:var(--paper2);opacity:.7}
.kpi .lbl{font-size:13px;color:var(--ink2);font-weight:600;position:relative}
.kpi .kpi-num{font-size:30px;color:var(--orange-d);margin:4px 0 0;position:relative}
.kpi .sub{font-size:12px;color:var(--ink2);position:relative}
.kpi .ic{position:absolute;right:14px;bottom:12px;font-size:22px;opacity:.5}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card h2{font-size:17px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.card h2 .ic{color:var(--orange)}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--paper2);color:var(--ink);font-weight:600;font-family:'Sarabun';text-align:left;
  padding:10px 12px;border-bottom:2px solid var(--line);position:sticky;top:0;white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid #F0E2CF}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:#FFFBF4}
.tbl .num{text-align:center;font-variant-numeric:tabular-nums}
.tbl .no{color:var(--ink2);font-size:13px;width:42px;text-align:center}
.tbl .sid{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px}
.tbl-wrap{max-height:560px;overflow:auto;border-radius:10px;border:1px solid var(--line)}

/* Schedule grid */
.sched{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.sched th,.sched td{border:1px solid var(--line);padding:5px 4px;text-align:center;vertical-align:middle;height:48px}
.sched th{background:var(--paper2);font-weight:600;font-size:11.5px}
.sched .day{background:var(--orange);color:#fff;font-weight:600;width:46px;font-family:'Mitr'}
.sched .cls{color:#fff;border-radius:7px;padding:6px 4px;font-size:11px;line-height:1.35;font-weight:500}
.sched .c-res{background:linear-gradient(135deg,#3F8E5B,#2f6e46)}
.sched .c-info{background:linear-gradient(135deg,#2F6F8F,#235471)}
.sched .c-pr{background:linear-gradient(135deg,#E8702A,#C6571A)}
.sched .c-info2{background:linear-gradient(135deg,#7A5BB0,#5e4690)}

/* Buttons / status */
.btn{font-family:'Sarabun';font-weight:600;font-size:13.5px;border:0;border-radius:9px;padding:9px 15px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-pri{background:var(--orange);color:#fff;box-shadow:0 3px 9px rgba(232,112,42,.3)}
.btn-pri:hover{background:var(--orange-d)}
.btn-gh{background:var(--paper2);color:var(--ink)}
.btn-gh:hover{background:var(--tan)}
.btn-sm{padding:6px 11px;font-size:12.5px}
.st-group{display:inline-flex;gap:4px;background:var(--paper);padding:3px;border-radius:10px;border:1px solid var(--line)}
.st{border:0;cursor:pointer;font-family:'Sarabun';font-weight:600;font-size:12.5px;padding:6px 11px;border-radius:7px;background:transparent;color:var(--ink2);transition:.12s}
.st:hover{background:#fff}
.st.on.s-present{background:var(--green);color:#fff}
.st.on.s-late{background:var(--amber);color:#fff}
.st.on.s-leave{background:var(--blue);color:#fff}
.st.on.s-dress{background:#8A5BB5;color:#fff}
.st.on.s-absent{background:var(--red);color:#fff}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.pill.p-present{background:var(--green-l);color:var(--green)}
.pill.p-late{background:var(--amber-l);color:var(--amber)}
.pill.p-leave{background:#DCEAF1;color:var(--blue)}
.pill.p-absent{background:var(--red-l);color:var(--red)}
.pill.p-dress{background:#EEE4F5;color:#8A5BB5}
.st-group .st{padding:6px 8px}

.inp{font-family:'Sarabun';font-size:14px;width:74px;text-align:center;border:1.5px solid var(--line);border-radius:8px;padding:6px;background:#FFFDF9;font-variant-numeric:tabular-nums}
.inp:focus{outline:none;border-color:var(--orange);background:#fff}
.inp.wide{width:100%;text-align:left}

.grade-badge{display:inline-grid;place-items:center;min-width:42px;padding:4px 10px;border-radius:9px;font-size:15px;color:#fff}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:12px 22px;border-radius:30px;font-size:14px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.25);
  opacity:0;pointer-events:none;transition:.3s;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:46px 20px;color:var(--ink2)}
.empty .big{font-size:40px;opacity:.5;margin-bottom:8px}
.bar{height:8px;background:var(--paper2);border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange-l),var(--orange));border-radius:5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.menu-toggle{display:none}

/* ===== Official banner + developer credit ===== */
.gov-banner{display:flex;align-items:center;gap:18px;padding:15px 22px;margin-bottom:18px;
  background:linear-gradient(180deg,#FFFFFF,#FFF7EC);border:1px solid var(--line)}
.gov-logo{height:76px;width:auto;flex:0 0 auto;object-fit:contain}
.gov-logo-prog{height:66px;width:66px;border-radius:14px;background:#fff;object-fit:contain;padding:4px;box-shadow:0 1px 4px rgba(58,36,23,.15)}
.gov-logo-empty{height:66px;width:66px;flex:0 0 auto;border:2px dashed var(--line);border-radius:14px;display:grid;place-items:center;
  font-size:11px;color:var(--ink2);text-align:center;line-height:1.3;cursor:pointer;background:rgba(255,255,255,.5)}
.logo-prev{height:72px;width:72px;border-radius:14px;background:#fff;object-fit:contain;padding:4px;border:1.5px solid var(--line)}
.gov-mid{flex:1;text-align:center;line-height:1.45;min-width:0}
.gov-uni{font-family:'Mitr',sans-serif;font-weight:600;font-size:18px;color:var(--ink)}
.gov-sub{font-size:13.5px;color:var(--ink2)}
.gov-title{font-family:'Mitr',sans-serif;font-weight:600;color:var(--orange-d);font-size:15px;margin-top:3px}
.gov-term{font-size:12px;color:var(--ink2);margin-top:3px}
.dev-credit{font-size:11px;opacity:.82;padding:9px 10px 0;border-top:1px solid rgba(255,255,255,.2);margin-top:8px;line-height:1.5}
@media(max-width:600px){
  .gov-banner{gap:11px;padding:12px}
  .gov-logo{height:50px}.gov-logo-prog,.gov-logo-empty{height:46px;width:46px}
  .gov-uni{font-size:15px}.gov-sub{font-size:12px}.gov-title{font-size:13px}
}

<script type="text/plain" id="gscode">function doPost(e){
  var out = {ok:false};
  try{
    var req = JSON.parse(e.postData.contents);
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    if(req.action === 'push'){
      var names = Object.keys(req.sheets);
      names.forEach(function(name){
        var sh = ss.getSheetByName(name) || ss.insertSheet(name);
        sh.clearContents();
        var m = req.sheets[name];
        if(m && m.length){ sh.getRange(1,1,m.length,m[0].length).setValues(m); }
        sh.setFrozenRows(1);
      });
      out = {ok:true, action:'push', count:names.length};
    } else if(req.action === 'pull'){
      var res = {};
      (req.names||[]).forEach(function(name){
        var sh = ss.getSheetByName(name);
        if(sh && sh.getLastRow() > 0){ res[name] = sh.getDataRange().getValues(); }
      });
      out = {ok:true, action:'pull', sheets:res};
    }
  }catch(err){ out = {ok:false, error:String(err)}; }
  return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);
}
function doGet(e){
  return ContentService.createTextOutput('ระบบสมุดสีส้ม — Google Sheets sync พร้อมใช้งาน').setMimeType(ContentService.MimeType.TEXT);
}</script>

const SEM_START = '2026-06-22';    // จันทร์ สัปดาห์ที่ 1 (22 มิ.ย. 2569)
const TOTAL_WEEKS = 16;
/* ===== เกณฑ์คะแนนการมาเรียนแบบยืดหยุ่น =====
   ค่าเริ่มต้น: มา=2 สาย=1 ลา=1 แต่งกายไม่เรียบร้อย=1 ขาด=0 (เต็ม/ครั้ง = ค่าสูงสุดของทุกสถานะ)
   อาจารย์แต่ละท่านปรับได้เองที่เมนู จัดการวิชา → ตั้งค่าคะแนนการมาเรียน (เก็บแยกรายผู้ใช้) */
const ATT_DEFAULT = {present:2, late:1, leave:1, dress:1, absent:0};
const ATT_KEY = 'osnbu:attcfg';
let ATT_CFG = {...ATT_DEFAULT};
try{ const s=localStorage.getItem(ATT_KEY); if(s){ ATT_CFG={...ATT_DEFAULT, ...JSON.parse(s)}; } }catch(e){}
function saveAttCfg(){ try{ localStorage.setItem(ATT_KEY, JSON.stringify(ATT_CFG)); }catch(e){} }
function stScore(k){ const v=+ATT_CFG[k]; return isFinite(v)&&v>=0 ? v : (ATT_DEFAULT[k]??0); }
function maxPerSession(){ return Math.max(...Object.keys(ATT_DEFAULT).map(stScore), 0) || 1; }
const STATUS = {
  present:{th:'มาเรียน', sym:'/', c:'present'},
  late:   {th:'มาสาย',  sym:'ส', c:'late'},
  leave:  {th:'ลา',     sym:'ล', c:'leave'},
  dress:  {th:'แต่งกายไม่เรียบร้อย', sym:'ม', c:'dress'},
  absent: {th:'ขาดเรียน', sym:'ข', c:'absent'},
};
const DAY_NUM = {'อาทิตย์':0,'จันทร์':1,'อังคาร':2,'พุธ':3,'พฤหัสบดี':4,'ศุกร์':5,'เสาร์':6};
const SYM2ST = {}; Object.entries(STATUS).forEach(([k,v])=>{SYM2ST[v.sym]=k;});
function thShort(iso){const d=new Date(iso+'T00:00');return d.getDate()+'/'+(d.getMonth()+1);}
// สร้างวันเช็คชื่อรายสัปดาห์ตามวันเรียนของวิชา
function isoLocal(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),da=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${da}`;}
function sessionDates(course){
  const wd = DAY_NUM[course.day]; if(wd===undefined) return [];
  const mon = new Date(SEM_START+'T00:00');           // จันทร์สัปดาห์ที่ 1
  const out=[];
  for(let w=0; w<TOTAL_WEEKS; w++){
    const dt=new Date(mon); dt.setDate(mon.getDate()+w*7+(wd-1));
    out.push({week:w+1, iso:isoLocal(dt)});
  }
  return out;
}
/* ===== เกณฑ์ตัดเกรด (ปรับได้เอง — เก็บแยกรายผู้ใช้ ไม่กระทบข้อมูลวิชา) =====
   ค่าเริ่มต้น: เกณฑ์มาตรฐาน 8 ระดับ A–F  ·  อาจารย์แต่ละมหาวิทยาลัยแก้ได้ที่เมนู จัดการวิชา */
const GRADE_DEFAULT = [
  [80,'A','#2e7d4a'],[75,'B+','#4f9a3f'],[70,'B','#6fae3a'],
  [65,'C+','#c79a12'],[60,'C','#d98a1a'],[55,'D+','#d96a1f'],
  [50,'D','#c8542a'],[0,'F','#b23b2b']
];
const GB_KEY = 'osnbu:gradebands';
const GRADE_BANDS = GRADE_DEFAULT.map(b=>[...b]);   // อาร์เรย์ทำงานจริง (แก้ในที่ได้)
function normalizeBands(){
  GRADE_BANDS.sort((a,b)=>b[0]-a[0]);                // เรียงจากสูงไปต่ำเสมอ
  if(GRADE_BANDS.length) GRADE_BANDS[GRADE_BANDS.length-1][0]=0;   // ระดับต่ำสุดต้องเริ่มที่ 0
}
function setBands(arr){
  GRADE_BANDS.length=0;
  arr.forEach(b=>GRADE_BANDS.push([+b[0]||0, String(b[1]||'?'), String(b[2]||'#8a8a8a')]));
  normalizeBands();
}
function loadGradeBands(){
  try{ const raw=localStorage.getItem(GB_KEY);
    if(raw){ const a=JSON.parse(raw); if(Array.isArray(a)&&a.length>=2) setBands(a); }
  }catch(e){}
}
function saveGradeBands(){ try{ localStorage.setItem(GB_KEY, JSON.stringify(GRADE_BANDS)); }catch(e){} }
function isCustomBands(){ try{ return !!localStorage.getItem(GB_KEY); }catch(e){ return false; } }
loadGradeBands();
function bandRangeText(i){
  const b=GRADE_BANDS[i];
  const hi = i===0 ? 100 : GRADE_BANDS[i-1][0];
  return i===0 ? `${b[0]} – 100` : (i===GRADE_BANDS.length-1 ? `ต่ำกว่า ${hi}` : `${b[0]} – ${(hi-0.01).toFixed(2)}`);
}
function gradeOf(p){for(const b of GRADE_BANDS){if(p>=b[0])return b;}return GRADE_BANDS.at(-1);}

/* ---- storage adapter: ใช้ได้ทั้งในแอป Claude และเปิดเองบนมือถือ ---- */
const Store = {
  mode: 'memory',
  async get(k){
    if(typeof window!=='undefined' && window.storage){
      try{ const r=await window.storage.get(k); Store.mode='cloud'; return r; }catch(e){}
    }
    try{ const v=localStorage.getItem(k); Store.mode='local'; return v?{value:v}:null; }catch(e){ return null; }
  },
  async set(k,v){
    if(typeof window!=='undefined' && window.storage){
      try{ const r=await window.storage.set(k,v); Store.mode='cloud'; return r; }catch(e){}
    }
    try{ localStorage.setItem(k,v); Store.mode='local'; return {value:v}; }catch(e){ throw e; }
  },
  async del(k){
    if(typeof window!=='undefined' && window.storage){
      try{ await window.storage.delete(k); }catch(e){}
    }
    try{ localStorage.removeItem(k); }catch(e){}
  }
};
function storeLabel(){return Store.mode==='cloud'?'ระบบ Claude':Store.mode==='local'?'หน่วยความจำเครื่องนี้':'ชั่วคราว (ยังไม่บันทึก)';}

/* ---- course list (metadata + rosters) ---- */
async function loadCourseList(){
  try{
    const r = await Store.get(CL_KEY);
    if(r && r.value){ COURSES = JSON.parse(r.value); }
    else { COURSES = JSON.parse(JSON.stringify(COURSES_SEED)); }   // first run: seed
  }catch(e){ COURSES = JSON.parse(JSON.stringify(COURSES_SEED)); }
  if(!Array.isArray(COURSES)) COURSES = [];
  if(!activeCourse || !byKey(activeCourse)) activeCourse = COURSES.length? COURSES[0].key : '';
}
async function saveCourseList(){
  // store only metadata + students (attendance/scores live under STK+key)
  const list = COURSES.map(c=>({key:c.key,code:c.code,title:c.title,section:c.section,
    sem:c.sem||'1/2569',credit:c.credit||'',room:c.room||'',day:c.day||'',time:c.time||'',
    students:c.students||[]}));
  try{ await Store.set(CL_KEY, JSON.stringify(list)); }
  catch(e){ toast('บันทึกรายการวิชาไม่สำเร็จ'); }
}

async function loadCourse(key){

  let data = {attendance:{}, activities:[], actScores:{}, exams:{}, examMax:{mid:30,fin:30}, weights:{...DEFAULT_W}, attBase:TOTAL_WEEKS*maxPerSession(),

/* ---- attendance score computation (point-based, เต็ม 2/สัปดาห์) ---- */
function attScore(d, sid, weight){
  const dates = Object.keys(d.attendance);
  const empty={pct:null, score:0, points:0, maxPoints:0, present:0, total:0, counts:{present:0,late:0,leave:0,dress:0,absent:0}};
  if(!dates.length) return empty;
  let earned=0, counts={present:0,late:0,leave:0,dress:0,absent:0};
  dates.forEach(dt=>{
    const st = d.attendance[dt][sid] || 'absent';
    earned += stScore(st); counts[st]=(counts[st]||0)+1;
  });
  const maxPoints = dates.length*maxPerSession();
  const pct = maxPoints? earned/maxPoints : 0;
  return {pct, score:+(pct*weight).toFixed(2), points:earned, maxPoints,
          present:counts.present, total:dates.length, counts};
}
function actTotal(d, sid){
  const sc = d.actScores[sid]||{};
  let got=0, max=0;
  d.activities.forEach(a=>{max+=(+a.max||0); got+=(+sc[a.id]||0);});
  return {got:+got.toFixed(2), max:+max.toFixed(2)};
}

/* แปลงข้อมูลวิชา -> ตาราง 2 มิติ (อ่านได้/แก้ได้ในชีต) */
function buildMatrix(c,d){
  const sess=sessionDates(c);
  const head=['ลำดับ','รหัสนักศึกษา','ชื่อ-นามสกุล'];
  sess.forEach(s=>head.push('W'+s.week+' '+thShort(s.iso)));
  d.activities.forEach(a=>head.push('กิจ:'+a.name+'|'+a.max));
  head.push('กลางภาค|'+d.examMax.mid, 'ปลายภาค|'+d.examMax.fin, 'มาเรียนดิบ', 'รวม', 'เกรด');
  const wsum=d.weights.att+d.weights.act+d.weights.mid+d.weights.fin;
  const rows=[head];
  c.students.forEach((st,i)=>{
    const a=attScore(d,st.id,d.weights.att);
    const attW=d.attBase>0?+(a.points/d.attBase*d.weights.att).toFixed(2):0;
    const at=actTotal(d,st.id);
    const actW=at.max>0?+(at.got/at.max*d.weights.act).toFixed(2):0;
    const e=d.exams[st.id]||{};
    const midW=(d.examMax.mid>0&&e.mid!=null&&e.mid!=='')?+(+e.mid/d.examMax.mid*d.weights.mid).toFixed(2):0;
    const finW=(d.examMax.fin>0&&e.fin!=null&&e.fin!=='')?+(+e.fin/d.examMax.fin*d.weights.fin).toFixed(2):0;
    const total=+(attW+actW+midW+finW).toFixed(2);
    const g=gradeOf(wsum>0?total/wsum*100:0)[1];
    const row=[i+1, st.id, st.name];
    sess.forEach(s=>{const r=d.attendance[s.iso]; row.push(r&&r[st.id]?STATUS[r[st.id]].sym:'');});
    const sc=d.actScores[st.id]||{};
    d.activities.forEach(a2=>row.push(sc[a2.id]??''));
    row.push(e.mid??'', e.fin??'', a.points, total, g);
    rows.push(row);
  });
  const w=Math.max(...rows.map(r=>r.length));
  rows.forEach(r=>{while(r.length<w)r.push('');});
  return rows;
}

/* แปลงตารางจากชีต -> ข้อมูลวิชา (รองรับการแก้สัญลักษณ์/คะแนนในชีตแล้วดึงกลับ) */
function parseMatrix(c,m){
  if(!m||m.length<2) return null;
  const head=m[0].map(x=>String(x));
  const sess=sessionDates(c);
  const weekCols=[], actCols=[]; let midCol=-1, finCol=-1, midMax=null, finMax=null;
  head.forEach((h,idx)=>{
    let mm;
    if(mm=h.match(/^W(\d+)/)){ weekCols.push({idx,week:+mm[1]}); }
    else if(h.indexOf('กิจ:')===0){ const body=h.slice(4); const p=body.lastIndexOf('|');
      actCols.push({idx,name:p>=0?body.slice(0,p):body,max:p>=0?(+body.slice(p+1)||0):10}); }
    else if(h.indexOf('กลางภาค')===0){ midCol=idx; const p=h.lastIndexOf('|'); if(p>=0)midMax=+h.slice(p+1)||0; }
    else if(h.indexOf('ปลายภาค')===0){ finCol=idx; const p=h.lastIndexOf('|'); if(p>=0)finMax=+h.slice(p+1)||0; }
  });
  const base=CUR[c.key]||{attendance:{},activities:[],actScores:{},exams:{},examMax:{mid:30,fin:30},weights:{...DEFAULT_W},attBase:TOTAL_WEEKS*maxPerSession()};
  const d={...base, attendance:{}, actScores:{}, exams:{}};
  d.activities=actCols.map((a,i)=>({id:'a'+i+'_'+(Date.now()%100000),name:a.name,max:a.max}));
  if(midMax!=null)d.examMax.mid=midMax; if(finMax!=null)d.examMax.fin=finMax;
  for(let r=1;r<m.length;r++){
    const sid=String(m[r][1]||'').trim(); if(!sid) continue;
    weekCols.forEach(wc=>{
      const sym=String(m[r][wc.idx]||'').trim();
      const sd=sess.find(s=>s.week===wc.week); if(!sd) return;
      const stt=SYM2ST[sym];
      if(stt){ if(!d.attendance[sd.iso])d.attendance[sd.iso]={}; d.attendance[sd.iso][sid]=stt; }
    });
    actCols.forEach((ac,i)=>{ const v=m[r][ac.idx];
      if(v!==''&&v!=null){ if(!d.actScores[sid])d.actScores[sid]={}; d.actScores[sid][d.activities[i].id]=+v||0; } });
    if(midCol>=0){ const v=m[r][midCol]; if(v!==''&&v!=null){ if(!d.exams[sid])d.exams[sid]={}; d.exams[sid].mid=+v||0; } }
    if(finCol>=0){ const v=m[r][finCol]; if(v!==''&&v!=null){ if(!d.exams[sid])d.exams[sid]={}; d.exams[sid].fin=+v||0; } }
  }
  return d;
}

async function sheetCall(payload){
  const res=await fetch(SHEET_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});
  return await res.json();
}
async function sheetPush(){
  if(!SHEET_URL){ toast('ยังไม่ได้ตั้งค่าลิงก์ Google Sheets'); return; }
  toast('กำลังส่งขึ้น Google Sheets…');
  const sheets={};
  for(const c of COURSES){ const d=await loadCourse(c.key); sheets[c.key]=buildMatrix(c,d); }
  try{
    const j=await sheetCall({action:'push',sheets});
    if(j&&j.ok) toast('ส่งขึ้น Google Sheets แล้ว ('+j.count+' วิชา)');
    else toast('ส่งไม่สำเร็จ: '+((j&&j.error)||'ตรวจลิงก์/การ Deploy'));
  }catch(e){ toast('เชื่อมต่อชีตไม่สำเร็จ — ตรวจลิงก์และสิทธิ์การเข้าถึง'); }
}
async function sheetPull(){
  if(!SHEET_URL){ toast('ยังไม่ได้ตั้งค่าลิงก์ Google Sheets'); return; }
  toast('กำลังดึงข้อมูลจากชีต…');
  try{
    const j=await sheetCall({action:'pull',names:COURSES.map(c=>c.key)});
    if(!j||!j.ok){ toast('ดึงไม่สำเร็จ: '+((j&&j.error)||'ตรวจลิงก์/การ Deploy')); return; }
    let n=0;
    for(const c of COURSES){ const m=j.sheets&&j.sheets[c.key]; if(!m)continue;
      const d=parseMatrix(c,m); if(d){ CUR[c.key]=d; await saveCourse(c.key); n++; } }
    toast('ดึงข้อมูลจากชีตแล้ว '+n+' วิชา'); go('data');
  }catch(e){ toast('เชื่อมต่อชีตไม่สำเร็จ — ตรวจลิงก์และสิทธิ์การเข้าถึง'); }
}

/* ---------- EXAM SCORES ---------- */
/* ===== ตัวช่วยนำเข้าคะแนนจาก Google Form / Google Sheets ===== */
function impDigits(x){ return String(x==null?'':x).replace(/[^0-9]/g,''); }

/* แยกข้อความที่วางมา -> {rows:[{id,score,raw}], bad:[บรรทัดที่จับคู่ไม่ได้]} */
function impParse(text, students){
  const map={};                                   // เลขล้วนของรหัส -> รหัสจริงในระบบ
  students.forEach(s=>{ const k=impDigits(s.id); if(k) map[k]=s.id; });
  const rows=[], bad=[];
  String(text||'').split(/\r?\n/).forEach(line=>{
    if(!line.trim()) return;
    let cells = line.indexOf('\t')>=0 ? line.split('\t') : line.split(/\s*,\s*|\s{2,}/);
    cells = cells.map(x=>String(x).trim());
    /* 1) หาช่องที่เป็น "รหัสนักศึกษา" โดยเทียบกับรายชื่อในวิชานี้ */
    let sid=null, idIdx=-1;
    for(let i=0;i<cells.length;i++){ const k=impDigits(cells[i]); if(k && map[k]){ sid=map[k]; idIdx=i; break; } }
    if(!sid){ bad.push(line.trim()); return; }
    /* 2) หาช่องคะแนน — รองรับรูปแบบ "27 / 30" ที่ Google Form ตรวจให้อัตโนมัติ */
    let sc=null;
    for(let i=0;i<cells.length;i++){
      if(i===idIdx) continue;
      const m=cells[i].match(/^(\d+(?:[.,]\d+)?)\s*\/\s*\d+(?:[.,]\d+)?$/);
      if(m){ sc=parseFloat(m[1].replace(',','.')); break; }
    }
    if(sc==null){
      for(let i=cells.length-1;i>=0;i--){
        if(i===idIdx) continue;
        if(/^\d+(?:[.,]\d+)?$/.test(cells[i])){ sc=parseFloat(cells[i].replace(',','.')); break; }
      }
    }
    if(sc==null){ bad.push(line.trim()); return; }
    rows.push({id:sid, score:sc, raw:line.trim()});
  });
  return {rows, bad};
}

/* ยุบกรณีนักศึกษาส่งซ้ำหลายครั้ง */
function impDedupe(rows, mode){
  const m={};
  rows.forEach(r=>{
    if(!(r.id in m)) m[r.id]=r.score;
    else if(mode==='max') m[r.id]=Math.max(m[r.id], r.score);
    else m[r.id]=r.score;                          // 'last' = ครั้งล่าสุดทับของเดิม
  });
  return m;
}

    const scaled={}; let over=0;
    Object.keys(raw).forEach(sid=>{
      let v=raw[sid]/from*to;
      v=Math.round(v*100)/100;
      if(colMax>0&&v>colMax){ over++; v=colMax; }
      scaled[sid]=v;
    });
    const got=Object.keys(scaled);
    const missing=c.students.filter(s=>!(s.id in scaled));
    impResult={target, scaled, missCount:missing.length};
    const nameOf=id=>{const s=c.students.find(x=>x.id===id); return s?s.name:id;};
    let o=`<div style="font-size:13.5px;line-height:1.8">
      ✅ จับคู่ได้ <strong>${got.length}</strong> คน จากทั้งหมด <strong>${c.students.length}</strong> คน<br>
      ${missing.length?`⚠️ ยังไม่มีคะแนน <strong>${missing.length}</strong> คน: <span style="color:var(--ink2)">${missing.map(s=>s.name).join(', ')}</span><br>`:''}
      ${bad.length?`⚠️ จับคู่ไม่ได้ <strong>${bad.length}</strong> บรรทัด (มักเป็นหัวตาราง หรือรหัสไม่ตรงรายชื่อ):<br><span style="color:var(--ink2);font-size:12px">${bad.slice(0,10).map(x=>x.replace(/</g,'&lt;')).join('<br>')}${bad.length>10?'<br>…':''}</span><br>`:''}
      ${over?`⚠️ มี <strong>${over}</strong> คน คะแนนเกินเต็มของช่อง (${colMax}) ระบบตัดลงเหลือเท่าคะแนนเต็ม<br>`:''}
      ${from!==to?`🔄 แปลงคะแนน: ดิบเต็ม ${from} → เก็บเต็ม ${to} (คูณ ${(to/from).toFixed(4)})<br>`:''}
    </div>
    <div class="tbl-wrap" style="max-height:260px;overflow:auto;margin-top:8px"><table class="tbl"><thead><tr><th>ชื่อ - นามสกุล</th><th class="num">ดิบ</th><th class="num">จะบันทึก</th></tr></thead><tbody>`;
    got.forEach(sid=>{ o+=`<tr><td>${nameOf(sid)}<br><span class="sid">${sid}</span></td><td class="num">${raw[sid]}</td><td class="num"><strong>${scaled[sid]}</strong></td></tr>`; });
    o+=`</tbody></table></div>`;
    $('#impOut').innerHTML=o;
    $('#impGo').style.display='inline-flex';
  };

  $('#impGo').onclick=async()=>{
    if(!impResult){ toast('กด "ตรวจสอบก่อน" ก่อนนะครับ'); return; }
    const {target,scaled}=impResult;
    const zero = $('#impMiss').value==='zero';
    let n=0;
    c.students.forEach(s=>{
      if(s.id in scaled){ if(!d.exams[s.id])d.exams[s.id]={}; d.exams[s.id][target]=scaled[s.id]; n++; }
      else if(zero){ if(!d.exams[s.id])d.exams[s.id]={}; d.exams[s.id][target]=0; }
    });
    await saveCourse(activeCourse);
    toast('นำเข้าคะแนนแล้ว '+n+' คน');
    impResult=null; go('exam');
  };
}

/* แปลงรายชื่อที่วางจาก Excel/ข้อความ -> [{id,name}] */
function parseRoster(text){
  const lines=(text||'').split(/\r?\n/).map(l=>l.replace(/\u00a0/g,' ').trim()).filter(Boolean);
  const out=[];
  lines.forEach(line=>{
    // ข้ามบรรทัดหัวตาราง
    if(/(^|\s)(ที่|ลำดับ|รหัส(นักศึกษา)?|no\.?)(\s|$)/i.test(line) && /(ชื่อ|name|นามสกุล)/i.test(line)) return;
    let parts=line.split(/\t|,|\s{2,}/).map(s=>s.trim()).filter(Boolean);
    if(parts.length===1) parts=line.split(/\s+/);
    const idIdx=parts.findIndex(p=>/^\d{6,15}$/.test(p));
    let id='', name='';
    if(idIdx>=0){
      id=parts[idIdx];
      name=parts.filter((p,i)=>i!==idIdx && !/^\d{1,3}$/.test(p)).join(' ').trim();
    } else {
      name=parts.filter(p=>!/^\d{1,3}$/.test(p)).join(' ').trim() || line;
    }
    if(id||name) out.push({id,name});
  });
  return out;
}

  // เกณฑ์คะแนนการมาเรียน (ยืดหยุ่นรายผู้ใช้)
  $('#attCfgSave').onclick=()=>{

    if(Math.max(...Object.values(next))<=0){ toast('อย่างน้อยหนึ่งสถานะต้องมีคะแนนมากกว่า 0'); return; }
    ATT_CFG=next; saveAttCfg();
    toast('บันทึกเกณฑ์คะแนนมาเรียนแล้ว (เต็ม/ครั้ง '+maxPerSession()+' คะแนน)'); go('manage');
  };
  $('#attCfgReset').onclick=()=>{
    ATT_CFG={...ATT_DEFAULT}; saveAttCfg(); toast('คืนค่าเกณฑ์เริ่มต้นแล้ว'); go('manage');
  };

  // เกณฑ์ตัดเกรด
  const gbRead=()=>GRADE_BANDS.map((b,i)=>{
    const nm=$('#gb_n_'+i), mn=$('#gb_m_'+i), cl=$('#gb_c_'+i);
    return [ mn&&!mn.disabled ? (parseFloat(mn.value)||0) : b[0],
             nm ? (nm.value.trim()||b[1]) : b[1],
             cl ? cl.value : b[2] ];
  });
  const gbApply=(arr,msg)=>{
    if(arr.length<2){ toast('ต้องมีอย่างน้อย 2 ระดับ'); return; }
    const names=arr.map(x=>x[1]);
    if(new Set(names).size!==names.length){ toast('ชื่อเกรดซ้ำกัน กรุณาแก้ไข'); return; }
    setBands(arr); saveGradeBands(); toast(msg); go('manage');
  };
  const gbS=$('#gbSave'); if(gbS) gbS.onclick=()=>gbApply(gbRead(),'บันทึกเกณฑ์ตัดเกรดแล้ว');
  const gbA=$('#gbAdd');  if(gbA) gbA.onclick=()=>{
    const cur=gbRead(); const lowest=cur[cur.length-1];
    const above=cur.length>1?cur[cur.length-2][0]:60;
    cur.splice(cur.length-1,0,[Math.max(1,Math.round(above/2)),'ใหม่'+cur.length,'#8a8a8a']);
    gbApply(cur,'เพิ่มระดับแล้ว — กรุณาตั้งชื่อและคะแนน');
  };
  const gbR=$('#gbReset'); if(gbR) gbR.onclick=()=>{
    if(!confirm('คืนค่าเกณฑ์ตัดเกรดเป็นมาตรฐาน A–F 8 ระดับ?')) return;
    setBands(GRADE_DEFAULT.map(b=>[...b]));

  };
  document.querySelectorAll('[data-gbdel]').forEach(b=>b.onclick=()=>{
    const cur=gbRead(); const i=+b.dataset.gbdel;
    if(cur.length<=2){ toast('ต้องมีอย่างน้อย 2 ระดับ'); return; }
    cur.splice(i,1); gbApply(cur,'ลบระดับแล้ว');
  });

  // live preview count
  const upd=()=>{const n=parseRoster($('#mRoster').value).length; $('#rCount').textContent='พบ '+n+' รายชื่อ';};
  $('#mRoster').oninput=upd; upd();

  const cc=$('#mCancel'); if(cc) cc.onclick=()=>{mgEditKey='';go('manage');};

}

async function mgSave(){
  const code=$('#mCode').value.trim().toUpperCase();
  const section=$('#mSec').value.trim();
  const title=$('#mTitle').value.trim();
  if(!code||!section||!title){ toast('กรุณากรอก รหัสวิชา หมู่เรียน และชื่อวิชา'); return; }
  const newKey=`${code}-${section}`;
  // duplicate check (only when adding, or when key changed during edit)
  if(newKey!==mgEditKey && byKey(newKey)){ toast('มีวิชา '+code+' หมู่'+section+' อยู่แล้ว'); return; }
  const students=parseRoster($('#mRoster').value);
  const obj={key:newKey, code, section, title,
    sem:PROFILE.term||'1/2569', credit:$('#mCredit').value.trim()||'3(2-2-5)',
    room:$('#mRoom').value.trim(), day:$('#mDay').value, time:$('#mTime').value.trim(),
    students};
  if(mgEditKey){
    const idx=COURSES.findIndex(c=>c.key===mgEditKey);
    if(idx>=0) COURSES[idx]=obj;
    // if the key changed, migrate stored attendance/score data
    if(newKey!==mgEditKey){
      try{ const r=await Store.get(STK+mgEditKey); if(r&&r.value){ await Store.set(STK+newKey, r.value); await Store.del(STK+mgEditKey); } }catch(e){}
      delete CUR[mgEditKey];
      if(activeCourse===mgEditKey) activeCourse=newKey;
    }
    delete CUR[newKey];
  } else {
    COURSES.push(obj);
  }
  if(!activeCourse) activeCourse=newKey;
  await saveCourseList();
  mgEditKey='';
  toast('บันทึกวิชา '+code+' หมู่'+section+' แล้ว ('+students.length+' คน)');
  go('manage');
}
function mgEdit(key){ mgEditKey=key; go('manage'); setTimeout(()=>window.scrollTo(0,document.body.scrollHeight*0.4),60); }
async function mgDelete(key){
  const c=byKey(key); if(!c) return;
  if(!confirm(`ลบวิชา ${c.code} หมู่${c.section} และข้อมูลการเช็คชื่อ/คะแนนทั้งหมดของวิชานี้?\n(กด "สำรองข้อมูล" เก็บไฟล์ไว้ก่อนได้)`)) return;
  COURSES=COURSES.filter(x=>x.key!==key);
  await Store.del(STK+key); delete CUR[key];
  if(activeCourse===key) activeCourse=COURSES.length?COURSES[0].key:'';
  if(mgEditKey===key) mgEditKey='';
  await saveCourseList();
  toast('ลบวิชา '+c.code+' หมู่'+c.section+' แล้ว');
  go('manage');
}
async function mgClearAll(){
  if(!confirm('ล้างรายวิชาและข้อมูลทั้งหมด เพื่อเริ่มระบบใหม่?\nการกระทำนี้ย้อนกลับไม่ได้ — ควรสำรองข้อมูลไว้ก่อน')) return;
  if(!confirm('ยืนยันอีกครั้ง: ลบทุกอย่างจริงหรือไม่?')) return;
  for(const c of COURSES){ await Store.del(STK+c.key); }
  COURSES=[]; CUR={}; activeCourse=''; mgEditKey='';
  await saveCourseList();
  toast('ล้างข้อมูลทั้งหมดแล้ว — เริ่มเพิ่มวิชาของคุณได้เลย');
  go('manage');
}

/* ---------- GRADE (ตัดเกรด) ---------- */
async function pageGrade(){
  if(!ensureCourse()){ $('#view').innerHTML=header('')+noCourseView(); return; }

  const interim=+d.interim||0, fin=+d.final||0, attMax=+d.attMax||0;
  const sumIF=interim+fin;
  const remain=+(interim-attMax).toFixed(2);   // ส่วนที่เหลือของระหว่างภาค (สำหรับกิจกรรม/สอบกลางภาค เทียบสัดส่วน)

  h+=printHead('แบบสรุปผลการเรียนและการตัดเกรด', `${c.code} หมู่ ${c.section} · ${c.title}`);

  h+=`<div class="card no-print"><h2><span class="ic">⚖️</span>กำหนดสัดส่วนคะแนน</h2>
    <div class="row">
      <div><label class="fld">คะแนนระหว่างภาค</label><input class="inp" id="wInt" value="${interim}"></div>
      <div><label class="fld">คะแนนปลายภาค</label><input class="inp" id="wFin" value="${fin}"></div>
      <span class="crumb" style="align-self:center">รวม = <strong>${sumIF}</strong> ${sumIF!==100?'⚠️ ควรเป็น 100':'✓'}</span>
    </div>
    <div class="row">
      <div><label class="fld">เช็กชื่อ = กี่คะแนน (ในก้อนระหว่างภาค)</label><input class="inp" id="wAtt" value="${attMax}"></div>
      <div><label class="fld">ฐานเช็กชื่อเต็ม (ดิบ)</label><input class="inp" id="attBase" value="${d.attBase}"></div>
      <button class="btn btn-gh btn-sm" id="saveW" style="margin-bottom:1px">💾 บันทึกสัดส่วน</button>
      <button class="btn btn-pri btn-sm" id="exportG" style="margin-bottom:1px">⬇️ ส่งออก CSV</button>
    </div>
    <div class="crumb" style="line-height:1.6;margin-top:4px">
      • <strong>เช็กชื่อ</strong> คิดแยก = (คะแนนดิบสะสม ÷ ฐาน ${d.attBase}) × ${attMax} คะแนน<br>
      • <strong>กิจกรรม/สอบกลางภาค</strong> กรอกคะแนนดิบตามจริง (รวมเกินได้) ระบบจะเทียบสัดส่วนลงให้เหลือ <strong>${remain}</strong> คะแนน (= ระหว่างภาค ${interim} − เช็กชื่อ ${attMax})<br>
      • <strong>ปลายภาค</strong> = (คะแนนดิบ ÷ เต็ม ${d.examMax.fin}) × ${fin} คะแนน
      ${remain<0?'<br><span class="pill p-late">⚠️ เช็กชื่อมากกว่าระหว่างภาค กรุณาปรับ</span>':''}
    </div></div>`;

  // ---- คำนวณรายคน ----
  const rows=c.students.map((s,i)=>{
    const a=attScore(d,s.id,1);
    const attPart = d.attBase>0 ? +(a.points/d.attBase*attMax).toFixed(2) : 0;
    // ก้อนดิบระหว่างภาค = กิจกรรม + สอบกลางภาค
    const at=actTotal(d,s.id);
    const e=d.exams[s.id]||{};
    const midGot = (e.mid!=null && e.mid!=='')? +e.mid : 0;
    const midMax = (e.mid!=null && e.mid!=='')? (+d.examMax.mid||0) : 0;
    const poolGot = +(at.got+midGot).toFixed(2);
    const poolMax = +(at.max+midMax).toFixed(2);
    const factor = poolMax>0 ? remain/poolMax : 0;           // ตัวคูณเทียบสัดส่วน
    const actPart = +(at.got*factor).toFixed(2);              // กิจกรรม หลังเทียบ
    const midPart = +(midGot*factor).toFixed(2);              // กลางภาค หลังเทียบ
    const poolPart = +(actPart+midPart).toFixed(2);
    const interimScore = +(attPart+poolPart).toFixed(2);
    const finGot = (e.fin!=null && e.fin!=='')? +e.fin : null;

        <a href="#" class="no-print" onclick="go('manage');return false" style="color:var(--orange);font-weight:400;margin-left:6px">ปรับเกณฑ์</a></div>
      <div class="legend" style="margin:0">${critHtml}</div>
    </div>
    <div class="legend" style="margin:0 0 12px">${distHtml||'<span class="crumb">ยังไม่มีข้อมูลคะแนน</span>'}</div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th class="no">ที่</th><th>ชื่อ - นามสกุล</th>
      <th class="num">เช็กชื่อ<br><span style="font-size:11px;font-weight:400;color:var(--ink2)">${attMax}</span></th>
      <th class="num">กิจกรรม<br><span style="font-size:11px;font-weight:400;color:var(--ink2)">เทียบสัดส่วน</span></th>
      <th class="num">กลางภาค<br><span style="font-size:11px;font-weight:400;color:var(--ink2)">เทียบสัดส่วน</span></th>
      <th class="num">รวมระหว่างภาค<br><span style="font-size:11px;font-weight:400;color:var(--ink2)">${interim}</span></th>
      <th class="num">ปลายภาค<br><span style="font-size:11px;font-weight:400;color:var(--ink2)">${fin}</span></th>
      <th class="num">รวม</th><th class="num">เกรด</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    h+=`<tr><td class="no">${r.i}</td><td>${r.s.name}<br><span class="sid">${r.s.id}</span></td>
      <td class="num">${r.attPart}<br><span style="font-size:11px;color:var(--ink2)">ดิบ ${r.attPts}/${d.attBase}</span></td>
      <td class="num">${r.actPart}<br><span style="font-size:11px;color:var(--ink2)">ดิบ ${r.actGot}/${r.actMax}</span></td>
      <td class="num">${r.midPart}<br><span style="font-size:11px;color:var(--ink2)">${r.midMax>0?('ดิบ '+r.midGot+'/'+r.midMax):'-'}</span></td>
      <td class="num"><strong>${r.interimScore}</strong></td>
      <td class="num">${r.finPart}<br><span style="font-size:11px;color:var(--ink2)">${r.finGot!=null?('ดิบ '+r.finGot+'/'+d.examMax.fin):'-'}</span></td>
      <td class="num"><strong>${r.total}</strong></td>
      <td class="num"><span class="grade-badge" style="background:${r.g[2]}">${r.g[1]}</span></td></tr>`;
  });
  h+=`</tbody></table></div>${printSign()}</div>`;
  $('#view').innerHTML=h;

  const upd=()=>{d.interim=+$('#wInt').value||0; d.final=+$('#wFin').value||0; d.attMax=+$('#wAtt').value||0; go('grade');};
  ['wInt','wFin','wAtt'].forEach(id=>$('#'+id).onchange=upd);
  $('#attBase').onchange=e=>{d.attBase=+e.target.value||1;go('grade');};
  $('#saveW').onclick=async()=>{await saveCourse(activeCourse);toast('บันทึกสัดส่วนคะแนนแล้ว');};

function exportCSV(c,rows,d){
  let csv='\uFEFF';
  csv+=`รายงานผลการเรียน ${c.code} หมู่${c.section} ${c.title}\n`;
  csv+=`ผู้สอน ${PROFILE.teacher}, ภาคเรียน ${c.sem||PROFILE.term}\n`;
  csv+=`สัดส่วน: ระหว่างภาค ${d.interim} (เช็กชื่อ ${d.attMax} + กิจกรรม/กลางภาค ${(+d.interim-+d.attMax).toFixed(2)}) : ปลายภาค ${d.final}\n\n`;
  csv+=`ที่,รหัสนักศึกษา,ชื่อ-นามสกุล,เช็กชื่อ,กิจกรรม,กลางภาค,รวมระหว่างภาค(${d.interim}),ปลายภาค(${d.final}),รวม,เกรด\n`;
  rows.forEach(r=>{csv+=`${r.i},${r.s.id},"${r.s.name}",${r.attPart},${r.actPart},${r.midPart},${r.interimScore},${r.finPart},${r.total},${r.g[1]}\n`;});
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`เกรด_${c.code}_หมู่${c.section}.csv`;a.click();
  toast('ส่งออกไฟล์ CSV แล้ว');
}

async function importAll(file, mode){
  // mode: 'merge' = รวมกับของเดิม (ไม่ทับ) · 'replace' = แทนที่ทั้งหมด
  try{
    const txt=await file.text(); const obj=JSON.parse(txt);
    if(!obj.data && !obj.courses) throw new Error('ไฟล์ไม่ถูกต้อง');
    const incomingCourses = Array.isArray(obj.courses)? obj.courses : [];

    if(mode==='replace'){
      // ----- โหมดแทนที่ทั้งหมด (เหมือนกู้คืนเครื่องใหม่) -----
      if(obj.profile){ PROFILE={...PROFILE, ...obj.profile}; await saveProfile(); applyProfileFooter(); }
      if(obj.attCfg){ ATT_CFG={...ATT_DEFAULT, ...obj.attCfg}; saveAttCfg(); }
      if(Array.isArray(obj.gradeBands) && obj.gradeBands.length>=2){ setBands(obj.gradeBands); saveGradeBands(); }
      if(incomingCourses.length){ COURSES=incomingCourses; await saveCourseList(); }
      if(obj.data) for(const k of Object.keys(obj.data)){ CUR[k]=obj.data[k]; await saveCourse(k); }
      if(!activeCourse && COURSES.length) activeCourse=COURSES[0].key;
      toast('แทนที่ข้อมูลทั้งหมดแล้ว ('+COURSES.length+' วิชา)'); go('data'); return;
    }

    // ----- โหมดรวมข้อมูล (ไม่ทับของเดิม) -----
    // โปรไฟล์/เกณฑ์: เติมเฉพาะช่องที่ยังว่างอยู่ ไม่ทับค่าที่ตั้งไว้แล้ว
    if(obj.profile){
      const p={...obj.profile, ...Object.fromEntries(Object.entries(PROFILE).filter(([,v])=>v!=='' && v!=null))};
      PROFILE={...PROFILE, ...p}; await saveProfile(); applyProfileFooter();
    }
    if(obj.attCfg && !localStorage.getItem(ATT_KEY)){ ATT_CFG={...ATT_DEFAULT, ...obj.attCfg}; saveAttCfg(); }
    if(Array.isArray(obj.gradeBands) && obj.gradeBands.length>=2 && !isCustomBands()){ setBands(obj.gradeBands); saveGradeBands(); }

    const existKeys=new Set(COURSES.map(c=>c.key));
    const existSig =new Set(COURSES.map(c=>(c.code||'')+'|'+(c.section||'')));
    let added=0, skipped=0;
    for(const c of incomingCourses){
      let key=c.key;
      const sig=(c.code||'')+'|'+(c.section||'');
      // ข้ามถ้าวิชาซ้ำ (รหัส+หมู่เรียนตรงกัน) — กันข้อมูลเดิมถูกกวน
      if(existSig.has(sig)){ skipped++; continue; }
      // ถ้า key ชนกับของเดิม (แต่คนละวิชา) สร้าง key ใหม่ให้ไม่ทับ
      if(existKeys.has(key)){
        const nk='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
        if(obj.data && obj.data[c.key]!==undefined){ obj.data[nk]=obj.data[c.key]; }
        key=nk;
      }
      const nc={...c, key}; COURSES.push(nc); existKeys.add(key); existSig.add(sig);
      if(obj.data && obj.data[key]!==undefined){ CUR[key]=obj.data[key]; await saveCourse(key); }
      added++;
    }
    await saveCourseList();
    if(!activeCourse && COURSES.length) activeCourse=COURSES[0].key;
    toast('รวมข้อมูลแล้ว: เพิ่ม '+added+' วิชา'+(skipped?(' · ข้ามวิชาซ้ำ '+skipped):''));
    go('data');
  }catch(e){ toast('นำเข้าไม่สำเร็จ: '+e.message); }
}

/* ==================== ROUTER ==================== */
const ROUTES={dashboard:pageDashboard,schedule:pageSchedule,students:pageStudents,attend:pageAttend,activity:pageActivity,exam:pageExam,grade:pageGrade,manage:pageManage,data:pageData};
async function go(pg){
  activePage=pg;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.pg===pg));
  $('#view').innerHTML=`<div class="empty"><div class="big">📒</div>กำลังโหลด…</div>`;
  try{ await ROUTES[pg](); }catch(e){ $('#view').innerHTML=`<div class="empty"><div class="big">⚠️</div>เกิดข้อผิดพลาด: ${e.message}</div>`; console.error(e);}
  window.scrollTo(0,0);
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.pg));
(async function boot(){ await loadProfile(); await loadCourseList(); applyProfileFooter(); go('dashboard'); })();
